name: Update Dastarkhawn Menu

on:
  push:
    paths:
      - '.github/workflows/update-dastarkhawn-menu.yml'
      - 'services/food.html'

permissions:
  contents: write

jobs:
  update-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Mughlai specialities
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('services/food.html')
          s = p.read_text()
          if 'id="specialities"' in s:
              print('Dastarkhawn specialities already present; nothing to do.')
              raise SystemExit(0)

          section = '''<section id="specialities"><div class="wrap"><span class="eyebrow">POPULAR DISHES &amp; SPECIALITIES</span><div class="sec-head"><h2>Mughlai Food &amp; North Indian Specialities</h2><p class="lede">Mughlai food is the North Indian cooking style that developed in the kitchens of the Mughal court (16th–19th century), blending Persian and Central Asian techniques with Indian ingredients. Known for aromatic spices, slow-cooked preparations, fragrant rice and rich gravies, these dishes bring a royal-era culinary tradition to the Dastarkhawn table.</p></div><div class="grid-3"><div class="card"><h3>Biryani</h3><p>Fragrant rice layered with spice, flavour and slow-cooked goodness. Made with aromatic basmati rice, whole spices and a choice of ingredients.</p><p><span aria-label="Vegetarian">🟢</span> <strong>Veg</strong> &nbsp; <span aria-label="Non-vegetarian">🔴</span> <strong>Chicken</strong> &nbsp; <span aria-label="Non-vegetarian">🔴</span> <strong>Mutton</strong></p></div><div class="card"><h3>Korma</h3><p>A slow-cooked curry with a delicate, aromatic gravy, traditionally prepared with yogurt, spices and rich ingredients for a smooth, balanced flavour.</p><p><span aria-label="Non-vegetarian">🔴</span> <strong>Chicken</strong> &nbsp; <span aria-label="Non-vegetarian">🔴</span> <strong>Mutton</strong></p></div><div class="card"><h3>Nihari</h3><p>A slow-cooked comfort food with deep, hearty flavour. Meat is simmered with aromatic spices to create a rich and warming stew.</p><p><span aria-label="Non-vegetarian">🔴</span> <strong>Chicken</strong> &nbsp; <span aria-label="Non-vegetarian">🔴</span> <strong>Mutton</strong></p></div><div class="card"><h3>Rogan Josh</h3><p>A Kashmiri classic with Persian and Mughal influences, known for its aromatic gravy, warming spices and distinctive rich colour.</p><p><span aria-label="Non-vegetarian">🔴</span> <strong>Chicken</strong> &nbsp; <span aria-label="Non-vegetarian">🔴</span> <strong>Mutton</strong></p></div><div class="card"><h3>Shahi Paneer</h3><p>Paneer in a rich, mildly spiced royal-style gravy, with a smooth and indulgent texture.</p><p><span aria-label="Vegetarian">🟢</span> <strong>Vegetarian</strong></p></div><div class="card"><h3>Matar Paneer</h3><p>Soft paneer and green peas cooked in a fragrant North Indian gravy, combining comforting spices with a rich, home-style flavour.</p><p><span aria-label="Vegetarian">🟢</span> <strong>Vegetarian</strong></p></div><div class="card"><h3>Paneer Butter Masala</h3><p>Soft paneer in a creamy, mildly spiced tomato-based gravy — a popular North Indian favourite with a rich, buttery finish.</p><p><span aria-label="Vegetarian">🟢</span> <strong>Vegetarian</strong></p></div></div></div></section>'''

          marker = '<section id="why">'
          if marker not in s:
              raise SystemExit('Could not find insertion point in services/food.html')
          s = s.replace(marker, section + marker, 1)
          p.write_text(s)
          PY

      - name: Commit menu update
        run: |
          if git diff --quiet -- services/food.html; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'Shahsphere Website Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add services/food.html
          git commit -m 'Update Dastarkhawn Mughlai menu'
          git push
