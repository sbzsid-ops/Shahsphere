name: Apply Shahsphere Phase 1 SEO

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Phase 1 SEO improvements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          B='https://shahsphere.com'; S=B+'/assets/images/shahsphere-social-preview.svg'
          P={
          'index.html':('Shahsphere | IT, AI, Consulting, Education & Business Services','Shahsphere brings IT & digital, AI, business consulting, education, catering, manpower and India travel services together under one operating standard.',B+'/','website',None),
          'about.html':('About Shahsphere | One Sphere, Many Worlds','Learn about Shahsphere, a multi-service company bringing focused business lines together under one operating standard.',B+'/about.html','website',None),
          'contact.html':('Contact Shahsphere | Start a Conversation','Contact Shahsphere for IT, AI, consulting, education, Dastarkhawn catering, manpower or India travel inquiries.',B+'/contact.html','website',None),
          'services/it-digital.html':('IT & Digital Services | Website Development, SEO & Content | Shahsphere','Shahsphere builds fast websites, search engine optimization strategies and content systems designed to improve visibility and conversion.',B+'/services/it-digital.html','website',('IT & Digital Services','Website Development, Search Engine Optimization and Content Services')),
          'services/ai.html':('AI Services | Generative AI, Video & Automation | Shahsphere','Turn generative AI into practical business output with AI video, automation, internal tools and content services from Shahsphere.',B+'/services/ai.html','website',('AI Services','Generative AI, AI Video Production and Business Automation')),
          'services/consulting.html':('Business Consulting | CRM, Revenue & Growth Strategy | Shahsphere','Project-based consulting for CRM implementation, admissions and enrollment automation, revenue strategy and business expansion.',B+'/services/consulting.html','website',('Business Growth & Operations Consulting','CRM Implementation, Revenue Strategy and Business Consulting')),
          'services/education.html':('Education Services | Admissions, Enrollment & Growth | Shahsphere','Shahsphere helps education institutions modernize admissions, automate enrollment, improve campaigns and build international student pipelines.',B+'/services/education.html','website',('Education Services','Admissions, Enrollment Automation and Education Growth Services')),
          'services/food.html':('Dastarkhawn | Catering & Food Services | Shahsphere','Dastarkhawn by Shahsphere offers food and catering services with a focus on memorable experiences and reliable on-the-ground delivery.',B+'/services/food.html','website',('Dastarkhawn Catering & Food Services','Catering, Event Food Service and On-the-Ground Hospitality')),
          'services/staffing.html':('Manpower & Staffing Services | Shahsphere','Find flexible manpower and staffing solutions from Shahsphere for organizations that need dependable, on-the-ground support.',B+'/services/staffing.html','website',('Manpower & Staffing Services','Flexible Staffing and Manpower Support')),
          'services/travel.html':('India Travel Concierge | Personalized India Trips | Shahsphere','Plan a personalized India trip with Shahsphere, including curated itineraries, local coordination and on-the-ground travel support.',B+'/services/travel.html','website',('India Travel Concierge','Personalized India Travel Planning and Local Concierge Services'))}
          root='''<script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://shahsphere.com/#organization","name":"Shahsphere","url":"https://shahsphere.com/","logo":"https://shahsphere.com/favicon.svg","image":"'''+S+'''","description":"A multi-service company offering IT and digital services, AI services, business consulting, education services and on-the-ground service lines."},{"@type":"WebSite","@id":"https://shahsphere.com/#website","url":"https://shahsphere.com/","name":"Shahsphere","publisher":{"@id":"https://shahsphere.com/#organization"},"inLanguage":"en-US"}]}</script>'''
          links=[('IT & Digital','it-digital.html'),('AI Services','ai.html'),('Consulting','consulting.html'),('Education','education.html'),('Dastarkhawn','food.html'),('Manpower','staffing.html'),('India Travel','travel.html')]
          for fn,(title,desc,url,typ,svc) in P.items():
            p=Path(fn); t=p.read_text(encoding='utf-8'); fav='favicon.svg' if '/' not in fn else '../favicon.svg'
            schema=root if fn=='index.html' else ''
            if svc:
              n,st=svc
              schema=f'''<script type="application/ld+json">{{"@context":"https://schema.org","@graph":[{{"@type":"Service","@id":"{url}#service","name":"{n}","serviceType":"{st}","description":"{desc}","url":"{url}","provider":{{"@id":"https://shahsphere.com/#organization"}},"inLanguage":"en-US"}},{{"@type":"BreadcrumbList","@id":"{url}#breadcrumb","itemListElement":[{{"@type":"ListItem","position":1,"name":"Home","item":"https://shahsphere.com/"}},{{"@type":"ListItem","position":2,"name":"{n}","item":"{url}"}}]}}]}}</script>'''
            seo=f'''<!-- Shahsphere SEO START --><title>{title}</title><meta name="description" content="{desc}"><link rel="canonical" href="{url}"><meta name="robots" content="index, follow, max-image-preview:large"><meta property="og:type" content="{typ}"><meta property="og:site_name" content="Shahsphere"><meta property="og:title" content="{title}"><meta property="og:description" content="{desc}"><meta property="og:url" content="{url}"><meta property="og:image" content="{S}"><meta property="og:image:alt" content="Shahsphere — One sphere, many worlds"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="{title}"><meta name="twitter:description" content="{desc}"><meta name="twitter:image" content="{S}"><meta name="twitter:image:alt" content="Shahsphere — One sphere, many worlds"><link rel="icon" type="image/svg+xml" href="{fav}">{schema}<!-- Shahsphere SEO END -->'''
            if '<!-- Shahsphere SEO START -->' in t: t=re.sub(r'<!-- Shahsphere SEO START -->.*?<!-- Shahsphere SEO END -->',seo,t,flags=re.S)
            else: t=re.sub(r'<title>.*?</title>',seo,t,count=1,flags=re.S)
            def alt(m):
              tag=m.group(0)
              if re.search(r'\balt\s*=\s*["\'][^"\']+[^"\']*["\']',tag,re.I): return tag
              src=re.search(r'\bsrc\s*=\s*["\']([^"\']+)',tag,re.I)
              if not src:return tag
              name=Path(src.group(1).split('?')[0]).stem.replace('-',' ').replace('_',' ').strip().title()
              return tag.replace('<img',f'<img alt="{name} — Shahsphere service visual"',1)
            t=re.sub(r'<img\b[^>]*>',alt,t,flags=re.I)
            if svc:
              current=Path(fn).name; a=''.join(f'<a href="{h}">{n}</a>' for n,h in links if h!=current)
              related=f'''<!-- Shahsphere Related Services START --><section class="related-services" aria-label="Related Shahsphere services"><div class="wrap"><span class="eyebrow">EXPLORE MORE</span><h2>Related services from Shahsphere</h2><p>Explore other specialist service lines delivered under the same Shahsphere operating standard.</p><div class="related-service-links">{a}</div></div></section><!-- Shahsphere Related Services END -->'''
              t=re.sub(r'<!-- Shahsphere Related Services START -->.*?<!-- Shahsphere Related Services END -->','',t,flags=re.S)
              if '<footer' in t:t=t.replace('<footer',related+'<footer',1)
              else:t=t.replace('</body>',related+'</body>',1)
            p.write_text(t,encoding='utf-8')
          css=Path('styles.css').read_text(encoding='utf-8')
          block='''/* Shahsphere Related Services START */\n.related-services{padding:72px 0;border-top:1px solid var(--line,#dbe2ea);border-bottom:1px solid var(--line,#dbe2ea);background:var(--panel,#f7f9fc)}.related-services h2{margin:10px 0 12px}.related-services p{max-width:760px;color:var(--muted,#667085)}.related-service-links{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.related-service-links a{display:inline-flex;padding:10px 14px;border:1px solid var(--line,#dbe2ea);border-radius:999px;color:var(--ink,#172033);text-decoration:none;font-weight:600}.related-service-links a:hover{border-color:#3f5fb8;color:#3f5fb8}@media(max-width:640px){.related-services{padding:52px 0}}\n/* Shahsphere Related Services END */'''
          css=re.sub(r'/\* Shahsphere Related Services START \*/.*?/\* Shahsphere Related Services END \*/',block,css,flags=re.S) if '/* Shahsphere Related Services START */' in css else css+'\n'+block+'\n'
          Path('styles.css').write_text(css,encoding='utf-8')
          svg='''<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#0b1f3a"/><circle cx="900" cy="315" r="210" fill="none" stroke="#8fa8ff" stroke-width="3"/><text x="88" y="135" fill="#b9c8ff" font-family="Arial" font-size="24" font-weight="700">SHAHSPHERE</text><text x="88" y="250" fill="#fff" font-family="Arial" font-size="70" font-weight="700">One sphere,</text><text x="88" y="335" fill="#8fa8ff" font-family="Arial" font-size="70" font-weight="700">many worlds.</text><text x="88" y="405" fill="#d7deef" font-family="Arial" font-size="28">IT · AI · Consulting · Education · Lifestyle Services</text><text x="88" y="480" fill="#fff" font-family="Arial" font-size="24">shahsphere.com</text></svg>'''
          Path('assets/images/shahsphere-social-preview.svg').write_text(svg,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then echo 'No changes'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html about.html contact.html services/*.html styles.css assets/images/shahsphere-social-preview.svg
          git commit -m 'Apply Phase 1 SEO and indexing readiness improvements'
          git push
