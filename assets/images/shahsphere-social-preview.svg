      <stop offset="0" stop-color="#071126"/>
      <stop offset="0.52" stop-color="#0b1f3a"/>
      <stop offset="1" stop-color="#1f3f91"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9ab7ff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#5478e8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1d2e72" stop-opacity="0.15"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="18" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
