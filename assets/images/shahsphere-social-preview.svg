  <g transform="translate(90 82)" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.95">
    <circle cx="32" cy="32" r="27"/><path d="M5 32h54M32 5c8 8 12 17 12 27S40 51 32 59C24 51 20 42 20 32S24 13 32 5z"/>
